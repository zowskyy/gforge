[project]
name = "godotforge-adapter-nl"
version = "0.1.0"
description = "Optional natural-language candidate-manifest adapter for Godot Forge Hub — lives outside the AI-free default package (godotforge-core, godotforge-cli). See docs/contracts/candidate-manifest-adapter.md and docs/contracts/hub-v1.md §6."
requires-python = ">=3.12,<3.14"
dependencies = [
    "godotforge-core",
]

[project.scripts]
godotforge-compose = "godotforge_adapter_nl.compose:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godotforge_adapter_nl"]

[tool.uv.sources]
godotforge-core = { workspace = true }
