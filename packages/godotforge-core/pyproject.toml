[project]
name = "godotforge-core"
version = "0.1.0"
description = "Core services, contracts, and domain logic for Godot Forge"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godotforge_core"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
